user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream: "$upstream_addr"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # =========================================================================
    # 1. GZIP COMPRESSION CONFIGURATION
    # Wajib gzip on untuk JSON
    # =========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 100;
    gzip_types
        application/json
        text/plain
        text/css
        application/javascript
        text/javascript;

    # =========================================================================
    # 2. RATE LIMITING CONFIGURATION
    # Wajib limit_req dan menolak dengan status 429 Too Many Requests
    # =========================================================================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=3r/s;
    limit_req_status 429;

    # =========================================================================
    # 3. UPSTREAM LOAD BALANCING
    # Wajib menggunakan zone dan backend 3 replica
    # =========================================================================
    upstream backend_servers {
        zone backend_zone 64k;
        server web:80;
    }

    server {
        listen 80;
        server_name localhost;

        # =====================================================================
        # 4. SECURITY HEADERS & UPSTREAM HEADER
        # Minimal X-Content-Type-Options: nosniff dan X-Upstream: $upstream_addr
        # =====================================================================
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Upstream $upstream_addr always;

        # =====================================================================
        # 5. REVERSE PROXY /api/ (Rate Limited Endpoint)
        # =====================================================================
        location /api/ {
            limit_req zone=api_limit burst=2 nodelay;

            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header X-Upstream $upstream_addr always;
        }

        # =====================================================================
        # REVERSE PROXY / (Courty Web Application)
        # =====================================================================
        location / {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header X-Upstream $upstream_addr always;
        }
    }
}
