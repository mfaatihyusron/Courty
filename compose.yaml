services:
  nginx:
    image: nginx:alpine
    container_name: courty_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - courty_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      replicas: 3
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-courty_user}
      DB_PASSWORD: ${DB_PASSWORD:-courty_password}
      DB_NAME: ${DB_NAME:-courty}
      APP_BASE_URL: http://localhost/
    depends_on:
      - db
    networks:
      - courty_network

  db:
    image: mysql:8.0
    container_name: courty_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-courty}
      MYSQL_USER: ${DB_USER:-courty_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-courty_password}
    volumes:
      - courty_db_data:/var/lib/mysql
      - ./courty.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - courty_network

volumes:
  courty_db_data:
    name: courty_db_data

networks:
  courty_network:
    name: courty_network
