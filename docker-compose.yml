services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: courty_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-courty_user}
      DB_PASSWORD: ${DB_PASSWORD:-courty_password}
      DB_NAME: ${DB_NAME:-courty}
      APP_BASE_URL: http://localhost:${APP_PORT:-8080}/
    depends_on:
      - db
    networks:
      - courty_network

  db:
    image: mysql:8.0
    container_name: courty_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-courty}
      MYSQL_USER: ${DB_USER:-courty_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-courty_password}
    volumes:
      - courty_db_data:/var/lib/mysql
      - ./courty.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - courty_network

volumes:
  courty_db_data:
    name: courty_db_data

networks:
  courty_network:
    name: courty_network
